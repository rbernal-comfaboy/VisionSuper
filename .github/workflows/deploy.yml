name: VisionSUPER Deployment

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construcción de imágenes
      - name: Build and push Service Integrator
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/service-integrator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/service-integrator:latest

      - name: Build and push Service Reports
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/service-reports/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/service-reports:latest

      - name: Build and push Web Angular
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web-angular/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web-angular:latest

      # Despliegue en Servidor vía SSH
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/visionsuper
            docker compose pull
            docker compose up -d
            docker image prune -f
