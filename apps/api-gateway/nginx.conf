worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Optimización para subida de archivos (Excel pesados)
    client_max_body_size 50M;

    upstream frontend {
        server web-angular:80;
    }

    upstream integrator {
        server service-integrator:3000;
    }

    upstream reports {
        server service-reports:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # --- Frontend ---
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Service Integrator (Extracción) ---
        location /api/v1/extraction {
            proxy_pass http://integrator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # --- Service Reports (Validación y XML) ---
        location /api/v1/validation {
            proxy_pass http://reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/files {
            proxy_pass http://reports;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
