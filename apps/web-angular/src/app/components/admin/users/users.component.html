<div class="admin-container">
  <div class="header">
    <h1>Gestión de Usuarios y Permisos</h1>
    <button mat-raised-button color="primary">
      <mat-icon>person_add</mat-icon> Nuevo Usuario
    </button>
  </div>

  <mat-card class="glass-card">
    <table mat-table [dataSource]="users" class="full-width">
      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCell"> Funcionario </th>
        <td mat-cell *matCell="let user"> {{user.nombre_completo}} </td>
      </ng-container>

      <!-- Rol Column -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCell"> Rol </th>
        <td mat-cell *matCell="let user"> 
          <span class="badge" [ngClass]="user.rol">{{user.rol}}</span>
        </td>
      </ng-container>

      <!-- Unidad Column -->
      <ng-container matColumnDef="unidad">
        <th mat-header-cell *matHeaderCell"> Unidad de Negocio </th>
        <td mat-cell *matCell="let user"> {{user.unidad_id}} </td>
      </ng-container>

      <!-- Acciones Column -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCell"> Acciones </th>
        <td mat-cell *matCell="let user">
          <button mat-icon-button color="accent"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
